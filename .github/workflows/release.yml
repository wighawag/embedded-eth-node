name: release

# Changesets release flow:
#   1. Land PRs that include a changeset (`.changeset/*.md`) on main.
#   2. This workflow opens/updates a "Version Packages" PR that bumps versions
#      and updates changelogs from the pending changesets.
#   3. Merging that PR (which removes the changesets) makes this workflow run
#      `changeset publish`, publishing the changed packages to npm.
#
# Auth is npm Trusted Publishing (OIDC): NO NPM_TOKEN secret. npm trusts this
# repo + workflow (release.yml) via the trusted publisher registered on the
# package's npmjs.com settings. The OIDC handshake needs `id-token: write`,
# Node >= 22, and a recent pnpm; publishes are stamped with provenance.
# `embedded-eth-node` is already on npm (0.0.1, 0.0.2) with the trusted publisher
# tied, so every release from the 0.1.0 bump onward goes through this tokenless
# OIDC flow.
#
# WHY THIS WORKFLOW DOES NOT RUN THE TEST SUITE, deliberately: `release:ci` runs
# `format:check` + `build` only. The full matrix (Playwright on Chromium AND
# WebKit, the differential conformance battery, and the cross-backend gas gate)
# lives in `ci.yml`, which runs on `pull_request` and on `push` to main. The
# commit this workflow publishes is therefore always one CI has already judged:
# the Version Packages PR gets the full matrix before it can be merged, and the
# merge itself triggers it again. Duplicating a ~2.5-min-per-engine browser
# matrix here would slow every release without adding a bar. If you ever publish
# from a commit that did NOT go through a PR, that reasoning no longer holds.
on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab, e.g. to (re-)run the Version-PR / publish
  # step after a merge that did not emit a push event (a GITHUB_TOKEN API merge
  # does not trigger `on: push`), or to re-publish idempotently.
  workflow_dispatch: {}

# Serialize release runs on main, but NEVER cancel an in-progress one:
# `changeset publish` may be mid-publish, and cancelling it would drop the
# release. `changeset publish` is idempotent (it skips versions already on npm),
# so letting each queued run finish is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version pinned EXPLICITLY because this repo has no `packageManager`
        # field in the root package.json for the action to read. Keep it in step
        # with `ci.yml`, which pins the same major.
        uses: pnpm/action-setup@v5
        with: {version: 10}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24 # >= 22 required for npm OIDC trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # release:ci format-checks + builds then runs `changeset publish` (the
          # action itself handles git commits/tags, so no git push here -- unlike
          # the local `release` script, which pushes branches and tags itself).
          # No NPM_TOKEN: npm detects the OIDC environment and authenticates via
          # the registered trusted publisher.
          publish: pnpm release:ci
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

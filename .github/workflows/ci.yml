name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build

  test:
    # Two engines on purpose. A JS EVM and a wasm EVM do not degrade the same way
    # across engines: on a quiet machine @ethereumjs/evm is ~1.3-1.9x slower on
    # WebKit (JavaScriptCore) than on V8, while revm-wasm shows no penalty. That
    # widens revm's lead from ~11x to ~18x and, more usefully, leaves the JS node
    # at ~90% of a 60fps frame budget on WebKit against revm's ~30%. Measuring
    # only Chromium hides it. (CI numbers themselves are too noisy to assert on --
    # only gas and result equality are asserted here.)
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: install browser
        run: pnpm --filter embedded-eth-node exec playwright install --with-deps ${{ matrix.browser }}

      # Correctness + honesty suite: differential conformance vs a trie-backed
      # @ethereumjs/vm reference, GeneralStateTests, the viem surface, persistence
      # across a real reload, the Worker wrapper, and senderMode:'trusted'
      # equivalence.
      - name: library tests
        run: pnpm --filter embedded-eth-node exec playwright test --project=${{ matrix.browser }}

      # The cross-backend GATE. What is asserted here is load-INVARIANT --
      # execution-gas equality and keccak-chain equality across every backend --
      # which is precisely what survives a noisy shared CI runner. The MGas/s and
      # frame timings are printed for information and are NOT asserted on; treat
      # CI numbers as indicative only and measure perf locally.
      #
      # EVERY backend runs here, revm-wasm included: its module is an ordinary
      # npm dependency (`revm-wasm`, prebuilt .wasm in the tarball), so there is
      # no build step and no artifact to fetch. The suite fails if any backend
      # drops out, because a gate that silently loses a backend is not a gate.
      - name: cross-backend gate
        run: pnpm --filter embedded-eth-node-benchmarks test --project=${{ matrix.browser }}
